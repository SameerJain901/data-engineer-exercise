version: 2

sources:
  - name: raw
    description: Raw sales data from CSV files
    schema: main
    tables:
      - name: sales_orders
        description: Raw sales orders data
        config:
          meta:
            external_location: "read_csv_auto('data/SalesOrders.csv', header=true)"

models:
  - name: int_order
    columns:
      - name: OrderId
        description: Order Id for the each order
        data_tests:
          - unique
      